name: Sync Android branch with VERA20K upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build an installable debug APK or signed release APK"
        type: choice
        options: [debug, release]
        default: debug
        required: true
      publish_release:
        description: "Publish the validated APK as a GitHub Release (workflow changes may require ANDROID_RELEASE_GITHUB_TOKEN)"
        type: boolean
        default: false
        required: true
  push:
    branches: [main, android-new]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "android/**"
      - ".github/workflows/sync-upstream-android.yml"

permissions:
  contents: read

concurrency:
  group: sync-android-new-${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve and freeze Android source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base_sha: ${{ steps.upstream.outputs.base_sha }}
      source_sha: ${{ steps.upstream.outputs.source_sha }}
      upstream_sha: ${{ steps.upstream.outputs.upstream_sha }}
      changed: ${{ steps.upstream.outputs.changed }}
      validate: ${{ steps.upstream.outputs.validate }}
      build_type: ${{ steps.upstream.outputs.build_type }}
      build_profile: ${{ steps.upstream.outputs.build_profile }}
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
      PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
      HAS_RELEASE_API_TOKEN: ${{ secrets.ANDROID_RELEASE_GITHUB_TOKEN != '' }}
    steps:
      - name: Check out android-new
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: android-new
          fetch-depth: 0

      - name: Merge latest upstream main and freeze source revision
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/YuriPlanet/vera20k.git
          git fetch upstream main
          git fetch origin main
          base_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse upstream/main)"
          changed=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/android-new ]]; then
            echo "Building fork revision without automatic upstream merge; scheduled sync remains strict."
            upstream_sha="$(git merge-base "$base_sha" "$upstream_sha")"
          elif git merge-base --is-ancestor "$upstream_sha" "$base_sha"; then
            echo "android-new already contains upstream $upstream_sha"
          else
            # Keep the candidate local until every dependent job validates it.
            git merge --no-ff --no-edit "$upstream_sha"
            changed=true
            echo "Merged upstream $upstream_sha into candidate $(git rev-parse HEAD)"
          fi
          if [[ "$PUBLISH_RELEASE" == true && "$BUILD_TYPE" != release ]]; then
            echo "::error::Public release publishing requires build_type=release."
            exit 1
          fi
          source_sha="$(git rev-parse HEAD)"
          if [[ "$PUBLISH_RELEASE" == true && "$HAS_RELEASE_API_TOKEN" != true ]] && \
             ! git diff --quiet origin/main "$source_sha" -- .github/workflows; then
            echo "::error::This release target changes .github/workflows relative to main. GITHUB_TOKEN cannot create that release tag; add repository secret ANDROID_RELEASE_GITHUB_TOKEN with Contents: write and Workflows: write, or publish from main. No build was started."
            exit 1
          fi
          build_profile=fast
          if [[ "$BUILD_TYPE" == release ]]; then build_profile=shipping; fi
          validate=false
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/android-new)" ]] ||
             [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] ||
             [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_ACTOR" != github-actions\[bot\] ]]; then
            validate=true
          fi
          {
            echo "base_sha=$base_sha"
            echo "source_sha=$source_sha"
            echo "upstream_sha=$upstream_sha"
            echo "changed=$changed"
            echo "validate=$validate"
            echo "build_type=$BUILD_TYPE"
            echo "build_profile=$build_profile"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Frozen Android source"
            echo "- Base fork revision: `$base_sha`"
            echo "- Candidate revision: `$source_sha`"
            echo "- Upstream revision: `$upstream_sha`"
            echo "- Upstream merge required: `$changed`"
            echo "- Build type: `$BUILD_TYPE`"
            echo "- Rust profile: `$build_profile`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bundle candidate merge for parallel jobs
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git update-ref refs/heads/ci/android-new-candidate "${{ steps.upstream.outputs.source_sha }}"
          git bundle create "$RUNNER_TEMP/android-new-source.bundle" \
            refs/heads/ci/android-new-candidate "^${{ steps.upstream.outputs.base_sha }}"

      - name: Upload candidate merge bundle
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-new-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-new-source.bundle
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  engine-tests:
    name: Rust engine regressions
    needs: prepare
    if: needs.prepare.outputs.validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      SOURCE_CHANGED: ${{ needs.prepare.outputs.changed }}
    steps:
      - name: Check out frozen base revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 1

      - name: Download upstream merge bundle when needed
        if: needs.prepare.outputs.changed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-new-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}

      - name: Check out frozen source revision
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SOURCE_CHANGED" == true ]]; then
            git fetch "$RUNNER_TEMP/android-new-source.bundle" \
              refs/heads/ci/android-new-candidate:refs/remotes/ci/android-new-candidate
            git checkout --detach refs/remotes/ci/android-new-candidate
          else
            git checkout --detach "$SOURCE_SHA"
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - name: Cache host-side engine test artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: android-new-engine-tests
          key: host-test-support

      - name: Set up host Rust compiler cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Enable compiler caching for engine tests
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

      - name: Install Linux audio headers
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libasound2-dev

      - name: Run focused storage, renderer, mod, and input regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          export VERA20K_COMMIT="$SOURCE_SHA"
          {
            python -m tools.cargo_run -- test -p vera20k-core --lib util::config::tests::android_config_folder_is_canonical_and_root_config_is_a_migration_fallback
            python -m tools.cargo_run -- test -p vera20k-core --lib util::config::tests::android_and_desktop_maps_use_the_shared_maps_directory
            python -m tools.cargo_run -- test -p vera20k --lib app::mods::tests::managed_mod_selection_does_not_treat_descendants_as_profiles
            python -m tools.cargo_run -- test -p vera20k-core --lib assets::asset_manager::install_inspection_tests::shared_ares_support_is_mod_only_and_a_mod_archive_takes_precedence
            python -m tools.cargo_run -- test -p vera20k-core --lib util::ini_roots::tests::explicit_mo_profile_resolves_its_roots_and_requires_the_complete_triplet
            python -m tools.cargo_run -- test -p vera20k-core --lib util::mod_definition::tests::mo_profile_defaults_to_mo_resources_and_manifest_overrides_only_named_slots
            python -m tools.cargo_run -- test -p vera20k-core --lib util::mod_definition::tests::mental_omega_manifest_identity_selects_mo_without_changing_unknown_mods
            python -m tools.cargo_run -- test -p vera20k-core --lib map::scenario_sources::tests::mental_omega_loose_catalog_discovers_and_loads_nested_maps
            python -m tools.cargo_run -- test -p vera20k-core --lib map::scenario_sources::tests::client_catalog_without_native_mode_match_keeps_native_modes_and_shared_maps
            python -m tools.cargo_run -- test -p vera20k-core --lib assets::client_install::tests::legacy_catalog_infers_modes_from_map_memberships_without_game_modes_registry
            python -m tools.cargo_run -- test -p vera20k-core --lib map::scenario_sources::tests::catalog_map_paths_reject_parent_and_absolute_components
            python -m tools.cargo_run -- test -p vera20k --lib app::persistence::options_profile::tests::launcher_renderer_write_is_narrow_persistent_and_rejects_desktop_only_apis
            python -m tools.cargo_run -- test -p vera20k --lib app::persistence::startup_backend::tests::android_renderer_fallback_tries_one_alternate_backend_without_a_cycle
            python -m tools.cargo_run -- test -p vera20k-core --lib assets::asset_manager::tests::mo_profile_resolves_and_loads_mo_roots_expansion_archive_and_mod_ares
            python -m tools.cargo_run -- test -p vera20k --lib app::input::touch::
            python -m tools.cargo_run -- test -p vera20k --lib app::input::camera::
            python -m tools.cargo_run -- test -p vera20k --lib app::input::dispatch::android_hud_group_tests::
            python -m tools.cargo_run -- test -p vera20k --lib render::skirmish_shell_chrome::
          } 2>&1 | tee build-logs/engine-tests.log

      - name: Report host compiler cache statistics
        if: always()
        run: sccache --show-stats || true

      - name: Upload engine test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-new-engine-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-logs/engine-tests.log
          if-no-files-found: ignore
          retention-days: 7

  launcher-tests:
    name: Android launcher tests
    needs: prepare
    if: needs.prepare.outputs.validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      SOURCE_CHANGED: ${{ needs.prepare.outputs.changed }}
    steps:
      - name: Check out frozen base revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 1

      - name: Download upstream merge bundle when needed
        if: needs.prepare.outputs.changed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-new-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}

      - name: Check out frozen source revision
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SOURCE_CHANGED" == true ]]; then
            git fetch "$RUNNER_TEMP/android-new-source.bundle" \
              refs/heads/ci/android-new-candidate:refs/remotes/ci/android-new-candidate
            git checkout --detach refs/remotes/ci/android-new-candidate
          else
            git checkout --detach "$SOURCE_SHA"
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.1.0"

      - name: Compile launcher and run JVM tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          bash .github/scripts/gradle-with-network-retry.sh -p android \
            :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --max-workers=2

      - name: Upload launcher test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-new-launcher-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 7

  arm64-native:
    name: Optimized ARM64 Rust library
    needs: prepare
    if: needs.prepare.outputs.validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      ANDROID_NDK_VERSION: "28.2.13676358"
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      SOURCE_CHANGED: ${{ needs.prepare.outputs.changed }}
      BUILD_TYPE: ${{ needs.prepare.outputs.build_type }}
      BUILD_PROFILE: ${{ needs.prepare.outputs.build_profile }}
      VERA20K_COMMIT: ${{ needs.prepare.outputs.source_sha }}
      CARGO_PROFILE_SHIPPING_STRIP: symbols
    steps:
      - name: Check out frozen base revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0

      - name: Download upstream merge bundle when needed
        if: needs.prepare.outputs.changed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-new-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}

      - name: Check out frozen source revision
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SOURCE_CHANGED" == true ]]; then
            git fetch "$RUNNER_TEMP/android-new-source.bundle" \
              refs/heads/ci/android-new-candidate:refs/remotes/ci/android-new-candidate
            git checkout --detach refs/remotes/ci/android-new-candidate
          else
            git checkout --detach "$SOURCE_SHA"
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Rust and ARM64 target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Calculate native source identity and cache key
        id: native-key
        shell: bash
        run: |
          set -euo pipefail
          # Exclude only launcher Java/Kotlin and Android resource files.
          # Everything else (including workflow, shaders, terrain and build scripts)
          # conservatively invalidates the library.
          exclusions=(':(exclude)android/app/src/main/java/**' ':(exclude)android/app/src/main/res/**')
          native_commit="$(git log -1 --format=%H "$SOURCE_SHA" -- . "${exclusions[@]}")"
          test -n "$native_commit"
          fingerprint="$(git ls-tree -r "$SOURCE_SHA" | awk -F '\t' '$2 !~ /^android\/app\/src\/main\/(java|res)\//' | sha256sum | cut -d' ' -f1)"
          toolchain="$(rustc -vV | sha256sum | cut -d' ' -f1)"
          echo "VERA20K_COMMIT=$native_commit" >> "$GITHUB_ENV"
          echo "native_commit=$native_commit" >> "$GITHUB_OUTPUT"
          echo "key=ih-native-v1-${RUNNER_OS}-${ImageVersion:-unknown}-$ANDROID_NDK_VERSION-$BUILD_PROFILE-$toolchain-$native_commit-$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore exact native library cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            android/app/src/main/jniLibs/arm64-v8a/libvera20k_android.so
            .native-cache-sha256
          key: ${{ steps.native-key.outputs.key }}

      - name: Verify cached native library
        if: steps.native-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check .native-cache-sha256
          mkdir -p build-logs
          echo "Exact native library cache hit; skipped ARM64 compilation." | tee build-logs/rust-android-arm64.log
          echo "Native library cache hit" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache ARM64 Cargo artifacts
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: android-new-arm64
          # Keep the former fast/shipping suffixes so this refactor can restore
          # the existing ARM64 caches instead of forcing a cold rebuild.
          key: ${{ needs.prepare.outputs.build_profile }}

      - name: Set up Android SDK
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.1.0"

      - name: Install pinned Android NDK
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if ! cargo ndk --version 2>/dev/null | grep -Fq "4.1.2"; then
            cargo install cargo-ndk --version 4.1.2 --locked
          fi

      - name: Set up Rust compiler cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Enable compiler caching for ARM64 build
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

      - name: Build optimized ARM64 native library
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          cargo ndk -t arm64-v8a --platform 26 -o android/app/src/main/jniLibs build \
            --profile "$BUILD_PROFILE" -p vera20k-android --no-default-features \
            2>&1 | tee build-logs/rust-android-arm64.log

      - name: Report compiler cache statistics
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        run: sccache --show-stats || true

      - name: Verify native library alignment and record hash
        shell: bash
        run: |
          set -euo pipefail
          native=android/app/src/main/jniLibs/arm64-v8a/libvera20k_android.so
          test -s "$native"
          readelf -lW "$native" | tee build-logs/native-program-headers.txt
          python3 - "$native" "$SOURCE_SHA" "$BUILD_TYPE" "$VERA20K_COMMIT" <<'PY'
          import re
          import sys
          from hashlib import sha256
          from pathlib import Path

          native = Path(sys.argv[1])
          source_sha = sys.argv[2]
          build_type = sys.argv[3]
          native_commit = sys.argv[4]
          text = __import__("subprocess").check_output(["readelf", "-lW", str(native)], text=True)
          alignments = [
              int(match.group(1), 16)
              for line in text.splitlines()
              if line.strip().startswith("LOAD")
              for match in [re.search(r"0x([0-9a-fA-F]+)\s*$", line)]
              if match
          ]
          if not alignments or min(alignments) < 16 * 1024:
              raise SystemExit(f"ARM64 LOAD alignment is below 16 KB: {alignments}")
          Path("dist").mkdir(exist_ok=True)
          Path("dist/native-build-manifest.txt").write_text(
              f"source_sha={source_sha}\nbuild_type={build_type}\nnative_source_sha={native_commit}\n"
              f"sha256={sha256(native.read_bytes()).hexdigest()}\n"
              f"load_alignments={','.join(hex(value) for value in alignments)}\n"
          )
          print(f"Verified ARM64 LOAD alignments: {alignments}")
          PY

      - name: Record native library cache checksum
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: sha256sum android/app/src/main/jniLibs/arm64-v8a/libvera20k_android.so > .native-cache-sha256

      - name: Save verified native library cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            android/app/src/main/jniLibs/arm64-v8a/libvera20k_android.so
            .native-cache-sha256
          key: ${{ steps.native-key.outputs.key }}

      - name: Stage native artifact with a flat download layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/native
          cp android/app/src/main/jniLibs/arm64-v8a/libvera20k_android.so dist/native/
          cp dist/native-build-manifest.txt dist/native/
          cp build-logs/rust-android-arm64.log dist/native/

      - name: Upload ARM64 native library for packaging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-new-native-${{ needs.prepare.outputs.build_type }}-${{ needs.prepare.outputs.source_sha }}-${{ github.run_attempt }}
          path: dist/native/**
          if-no-files-found: error
          retention-days: 14

  android-package:
    name: Package, verify, and publish Android APK
    needs: [prepare, engine-tests, launcher-tests, arm64-native]
    if: needs.prepare.outputs.validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      ANDROID_BUILD_TOOLS: "36.1.0"
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      SOURCE_CHANGED: ${{ needs.prepare.outputs.changed }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
      BUILD_TYPE: ${{ needs.prepare.outputs.build_type }}
      PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
      CARGO_PROFILE_SHIPPING_STRIP: symbols
    steps:
      - name: Check out frozen base revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0

      - name: Download upstream merge bundle when needed
        if: needs.prepare.outputs.changed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-new-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}

      - name: Check out frozen source revision
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SOURCE_CHANGED" == true ]]; then
            git fetch "$RUNNER_TEMP/android-new-source.bundle" \
              refs/heads/ci/android-new-candidate:refs/remotes/ci/android-new-candidate
            git checkout --detach refs/remotes/ci/android-new-candidate
          else
            git checkout --detach "$SOURCE_SHA"
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.1.0"

      - name: Download native artifact for exact source revision
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-new-native-${{ needs.prepare.outputs.build_type }}-${{ needs.prepare.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-output

      - name: Install native library into clean packaging checkout
        shell: bash
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/native-output/libvera20k_android.so"
          test -s "$native"
          grep -Fx "source_sha=$SOURCE_SHA" "$RUNNER_TEMP/native-output/native-build-manifest.txt"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$native" android/app/src/main/jniLibs/arm64-v8a/libvera20k_android.so

      - name: Prepare persistent release signing key
        if: env.BUILD_TYPE == 'release'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD \
                      ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository signing secret: $name"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/iron-harbor-release.keystore"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" \
            -storepass "$ANDROID_RELEASE_STORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null
          echo "ANDROID_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_STORE_PASSWORD=$ANDROID_RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Assemble selected APK variant
        shell: bash
        env:
          BUILD_TYPE: ${{ needs.prepare.outputs.build_type }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          if [[ "$BUILD_TYPE" == release ]]; then
            bash .github/scripts/gradle-with-network-retry.sh -p android \
              :app:assembleRelease --no-daemon --max-workers=2
          else
            mkdir -p android/.android
            keytool -genkeypair -keystore android/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            bash .github/scripts/gradle-with-network-retry.sh -p android \
              :app:assembleDebug --no-daemon --max-workers=2
          fi

      - name: Apply persistent signing to debug APK
        if: needs.prepare.outputs.build_type == 'debug'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD \
                      ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository signing secret: $name"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/iron-harbor-release.keystore"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" \
            -storepass "$ANDROID_RELEASE_STORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          signed="$RUNNER_TEMP/app-debug-persistent-signed.apk"
          "$tools/apksigner" sign --ks "$keystore" \
            --ks-key-alias "$ANDROID_RELEASE_KEY_ALIAS" \
            --ks-pass env:ANDROID_RELEASE_STORE_PASSWORD \
            --key-pass env:ANDROID_RELEASE_KEY_PASSWORD --out "$signed" "$apk"
          mv "$signed" "$apk"
          rm -f "$keystore"

      - name: Verify APK identity, signer, native library, and ZIP alignment
        shell: bash
        env:
          BUILD_TYPE: ${{ needs.prepare.outputs.build_type }}
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          version_code="$(sed -n 's/^val veraVersionCode = \([0-9][0-9]*\)$/\1/p' android/app/build.gradle.kts)"
          build_label="$(sed -n 's/^val veraBuildLabel = "\([^"]*\)"$/\1/p' android/app/build.gradle.kts)"
          if [[ "$BUILD_TYPE" == release ]]; then
            expected_id=org.ironharbor.mobile
            apk=android/app/build/outputs/apk/release/app-release.apk
          else
            expected_id=org.ironharbor.mobile.debug
            apk=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          test -s "$apk"
          "$tools/aapt" dump badging "$apk" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='$expected_id' versionCode='$version_code' versionName='$version_name'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "native-code: 'arm64-v8a'" "$RUNNER_TEMP/apk-badging.txt"
          signature="$RUNNER_TEMP/apk-signature.txt"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee "$signature"
          grep -F 'Signer #1 certificate SHA-256 digest: 7440ad6a732f410f570b55b8d7e0138b0a9ab318ce5553afc02e8e0527ce1711' "$signature"
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          unzip -t "$apk"
          unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libvera20k_android.so'
          expected_native_sha="$(sed -n 's/^sha256=//p' "$RUNNER_TEMP/native-output/native-build-manifest.txt")"
          actual_native_sha="$(unzip -p "$apk" lib/arm64-v8a/libvera20k_android.so | sha256sum | cut -d ' ' -f1)"
          test "$actual_native_sha" = "$expected_native_sha"
          mkdir -p dist
          suffix=".debug"
          if [[ "$BUILD_TYPE" == release ]]; then suffix=""; fi
          output="dist/IronHarborMobile ${build_label}${suffix}.apk"
          cp "$apk" "$output"
          sha256sum "$output" | tee dist/SHA256SUMS.txt
          printf 'source_sha=%s\nupstream_sha=%s\nbuild_type=%s\nversion_name=%s\nversion_code=%s\n' \
            "$SOURCE_SHA" "$UPSTREAM_SHA" "$BUILD_TYPE" "$version_name" "$version_code" \
            > dist/build-manifest.txt

      - name: Upload verified ARM64 APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IronHarborMobile-android-new-${{ needs.prepare.outputs.build_type }}-${{ needs.prepare.outputs.source_sha }}-${{ github.run_attempt }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/build-manifest.txt
          if-no-files-found: error
          retention-days: 14

      - name: Push validated upstream merge
        if: needs.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin android-new
          remote="$(git rev-parse FETCH_HEAD)"
          if git merge-base --is-ancestor "$SOURCE_SHA" "$remote"; then
            echo "The validated source is already included in android-new ($remote)."
          elif git merge-base --is-ancestor "$remote" "$SOURCE_SHA"; then
            git push origin "$SOURCE_SHA":refs/heads/android-new
          else
            echo "android-new advanced on a separate line while candidate $SOURCE_SHA was validated." >&2
            echo "Refusing to overwrite or publish an unvalidated combination." >&2
            exit 1
          fi

      - name: Publish verified B61 release
        if: >-
          success() && github.event_name == 'workflow_dispatch' &&
          needs.prepare.outputs.build_type == 'release' && inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.ANDROID_RELEASE_GITHUB_TOKEN || github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          version_code="$(sed -n 's/^val veraVersionCode = \([0-9][0-9]*\)$/\1/p' android/app/build.gradle.kts)"
          build_label="$(sed -n 's/^val veraBuildLabel = "\([^"]*\)"$/\1/p' android/app/build.gradle.kts)"
          if [[ "$build_label" != B61 || "$version_code" -le 267 ]]; then
            echo "::error::Refusing release: expected B61 and versionCode greater than B60's 267."
            exit 1
          fi
          tag="android-${build_label,,}"
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Refusing to replace existing tag $tag."
            exit 1
          fi
          apk="dist/IronHarborMobile ${build_label}.apk"
          test -s "$apk"
          sha="$(sha256sum "$apk" | cut -d ' ' -f1)"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          ## What's new since B60

          - Updates the Android build to VERA20K 0.4.3, including the upstream engine revision `$UPSTREAM_SHA`.
          - Fixes held-drag unit box selection so it begins at the original touch point and does not turn small hold jitter into a premature right-click.
          - Adds a launcher option to disable automatic startup diagnostic snapshots; engine logs, crash reports, and manual exports remain available.

          ## Compatibility

          - Package: `org.ironharbor.mobile`; version code: `$version_code` (B60 was 267).
          - ARM64 APK signed with the existing Iron Harbor release certificate for in-place updates.
          - You provide your own legally obtained game files; none are included.

          Fork source: `$SOURCE_SHA`

          Upstream source: `$UPSTREAM_SHA`

          SHA-256: `$sha`
          EOF
          printf 'SHA-256: %s\nAPK: %s\nFork source: %s\nUpstream source: %s\n' \
            "$sha" "$(basename "$apk")" "$SOURCE_SHA" "$UPSTREAM_SHA" > dist/changelog.txt
          gh release create "$tag" "$apk" dist/changelog.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Iron Harbor Mobile v${version_name} ${build_label}" \
            --notes-file "$notes" --target "$SOURCE_SHA" --latest
